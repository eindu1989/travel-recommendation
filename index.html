<!DOCTYPE html>
<html>
<head>
    <title>Travel Recommendation</title>
</head>
<body>

    <h1>Travel Recommendation Website</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a> |
        <a href="contact.html">Contact Us</a>

        <input type="text" id="searchInput" placeholder="Search destinations">

        <button onclick="searchDestination()">Search</button>
        <button onclick="clearResults()">Clear</button>
    </nav>

    <hr>

    <div id="results"></div>

    <script>

        function searchDestination() {

            let searchValue =
                document.getElementById("searchInput")
                .value.toLowerCase();

            let results =
                document.getElementById("results");

            if (searchValue.includes("beach")) {

                results.innerHTML = `

                <h2>Maldives Beach</h2>

                <img src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=500"
                     width="400">

                <p>
                Maldives Beach is famous for crystal-clear water
                and luxurious island resorts.
                </p>

                <h2>Bondi Beach</h2>

                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"
                     width="400">

                <p>
                Bondi Beach is one of Australia's most popular
                beach destinations.
                </p>

                `;
            }

            else if (searchValue.includes("temple")) {

                results.innerHTML = `

                <h2>Golden Temple</h2>

                <img src="https://images.unsplash.com/photo-1589308078059-be1415eab4c3?w=500"
                     width="400">

                <p>
                Golden Temple is one of the most visited
                religious sites in India.
                </p>

                <h2>Brihadeeswara Temple</h2>

                <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=500"
                     width="400">

                <p>
                Brihadeeswara Temple is a historic temple
                located in Tamil Nadu.
                </p>

                `;
            }

            else if (searchValue.includes("country")) {

                results.innerHTML = `

                <h2>India</h2>

                <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=500"
                     width="400">

                <p>
                India is known for its diverse culture,
                heritage, monuments, and cuisines.
                </p>

                <h2>Japan</h2>

                <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500"
                     width="400">

                <p>
                Japan is famous for technology,
                traditional temples, and beautiful landscapes.
                </p>

                `;
            }

            else {

                results.innerHTML =
                "<h3>No recommendations found.</h3>";
            }
        }

        function clearResults() {

            document.getElementById("searchInput").value = "";
            document.getElementById("results").innerHTML = "";
        }

    </script>

</body>
</html>
